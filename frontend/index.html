<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLens AI - Risk Assessment</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth Screen -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <div class="logo">
                    <div class="logo-icon">🏥</div>
                    <h1>HealthLens AI</h1>
                    <p>Intelligent Health Risk Assessment</p>
                </div>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showTab('login')">Login</button>
                    <button class="tab-btn" onclick="showTab('register')">Register</button>
                </div>
                
                <form id="login-form" class="auth-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>
                
                <form id="register-form" class="auth-form hidden">
                    <input type="text" id="reg-username" placeholder="Username" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Create Account</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen" class="screen">
            <nav class="navbar">
                <div class="nav-brand">
                    <span class="logo-icon">🏥</span>
                    <span>HealthLens AI</span>
                </div>
                <div class="nav-user">
                    <span id="user-email"></span>
                    <button onclick="logout()" class="btn-secondary">Logout</button>
                </div>
            </nav>

            <main class="dashboard">
                <div class="dashboard-grid">
                    <!-- Assessment Form -->
                    <section class="card assessment-form">
                        <h2>New Assessment</h2>
                        <form id="health-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Age</label>
                                    <input type="number" id="age" min="1" max="120" required>
                                </div>
                                <div class="form-group">
                                    <label>Weight (kg)</label>
                                    <input type="number" id="weight" step="0.1" min="20" max="300" required>
                                </div>
                                <div class="form-group">
                                    <label>Height (cm)</label>
                                    <input type="number" id="height" step="0.1" min="50" max="250" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Systolic BP</label>
                                    <input type="number" id="systolic" min="70" max="250" required>
                                </div>
                                <div class="form-group">
                                    <label>Diastolic BP</label>
                                    <input type="number" id="diastolic" min="40" max="150" required>
                                </div>
                                <div class="form-group">
                                    <label>Glucose (mg/dL)</label>
                                    <input type="number" id="glucose" step="0.1" min="50" max="600" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Smoking Status</label>
                                    <select id="smoking" required>
                                        <option value="NEVER">Never Smoked</option>
                                        <option value="FORMER">Former Smoker</option>
                                        <option value="CURRENT">Current Smoker</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Exercise Frequency</label>
                                    <select id="exercise" required>
                                        <option value="NONE">Sedentary</option>
                                        <option value="LIGHT">Light (1-2 days/week)</option>
                                        <option value="MODERATE">Moderate (3-5 days/week)</option>
                                        <option value="INTENSE">Intense (6-7 days/week)</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn-primary btn-large">
                                Calculate Risk Score
                            </button>
                        </form>
                    </section>

                    <!-- Results Card -->
                    <section id="results-card" class="card results-card hidden">
                        <h2>Risk Assessment Result</h2>
                        <div class="risk-display">
                            <div class="risk-score-circle" id="risk-circle">
                                <span class="score-value" id="risk-score">0</span>
                                <span class="score-label">Risk Score</span>
                            </div>
                            <div class="risk-info">
                                <h3 id="risk-level">LOW RISK</h3>
                                <p id="risk-message">Your health metrics look good!</p>
                            </div>
                        </div>
                        
                        <div class="metrics-grid">
                            <div class="metric">
                                <span class="metric-label">BMI</span>
                                <span class="metric-value" id="bmi-value">--</span>
                                <span class="metric-sub" id="bmi-category">--</span>
                            </div>
                        </div>

                        <div class="recommendations">
                            <h4>Personalized Recommendations</h4>
                            <ul id="recommendations-list"></ul>
                        </div>
                    </section>

                    <!-- History -->
                    <section class="card history-card">
                        <h2>Assessment History</h2>
                        <div id="history-list" class="history-list">
                            <p class="empty-state">No assessments yet</p>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
